  window.__RACC_ERR = function(title, detail) {
    var root = document.getElementById("root");
    if (!root) return;
    root.innerHTML =
      '<div class="errore-box">' +
        '<h2>' + title + '</h2>' +

var h = React.createElement;
var K = "raccdiff_";
var SUONO = typeof window !== "undefined" && "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;

function leggi(k, def){ try{ var v = localStorage.getItem(K+k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function salva(k, v){ try{ localStorage.setItem(K+k, JSON.stringify(v)); }catch(e){} }
function mescola(a){
  var b = a.slice();
  for(var i=b.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=b[i]; b[i]=b[j]; b[j]=tmp;
  }
  return b;
}

function voce(){
  try{
    var vs = speechSynthesis.getVoices() || [];
    var it = vs.filter(function(v){ return /^it/i.test(v.lang); });
    return it.find(function(v){ return /natural|neural|enhanced|premium/i.test(v.name); }) || it[0] || null;
  }catch(e){ return null; }
}
function parla(t){
  ULTIMO = t;
  if(!SUONO) return;
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t);
    u.lang = "it-IT"; u.rate = 0.85; u.pitch = 1.1;
    var v = voce(); if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

var CONT = [
  {id:"carta", nome:"carta", colore:"blu", emoji:"📄", cls:"c-carta",

  {id:"vetro", nome:"vetro", colore:"verde", emoji:"🫙", cls:"c-vetro",
   ci:"Bottiglie, barattoli e vasetti di vetro.", no:"Niente specchi e niente lampadine.", hint:"È di vetro: è dura e si vede attraverso."},
  {id:"organico", nome:"organico", colore:"marrone", emoji:"🍌", cls:"c-organico",
   ci:"Bucce, avanzi di cibo, fondi di caffè e foglie.", no:"Niente plastica e niente carta.", hint:"Viene dalla natura o è cibo."},
  {id:"indiff", nome:"indifferenziato", colore:"grigio", emoji:"🗑️", cls:"c-indiff",

];

// [emoji, nome, articolo, contenitore, tier: 1=scoperta, 2=facile, 3=normale/esperto]

  ["💧","bottiglia d'acqua","la","plastica",1],["🛍️","sacchetto di plastica","il","plastica",1],["🥤","bicchiere di plastica","il","plastica",1],
  ["🧸","giocattolo di plastica","il","plastica",1],["🪣","secchio di plastica","il","plastica",1],["🥣","vaschetta di yogurt","la","plastica",2],
  ["🥛","bottiglia di plastica del latte","la","plastica",2],["🧼","flacone di detersivo","il","plastica",2],["🍽️","vassoio di plastica","il","plastica",2],
  ["🧴","bottiglia di shampoo","la","plastica",3],["🥗","contenitore dell'insalata","il","plastica",3],["🔴","tappo di plastica","il","plastica",3],
  ["🧼","flaconcino di sapone liquido","il","plastica",3],

  ["🍾","bottiglia di vino","la","vetro",1],["🫙","barattolo di marmellata","il","vetro",1],["🍯","vasetto di miele","il","vetro",1],
  ["🥃","bicchiere di vetro","il","vetro",1],["🏺","vaso di vetro","il","vetro",1],["🍺","bottiglia di birra","la","vetro",2],
  ["🥒","barattolo di vetro dei sottaceti","il","vetro",2],["🍷","calice di vetro","il","vetro",2],["🍶","bottiglia di sciroppo","la","vetro",3],
  ["🧂","barattolo delle spezie","il","vetro",3],["🫙","vasetto di crema","il","vetro",3],["🫒","bottiglia di vetro dell'olio","la","vetro",3],
  ["🥛","bottiglia di vetro del latte","la","vetro",3],

  ["🍌","buccia di banana","la","organico",1],["🍎","avanzi di frutta","gli","organico",1],["🍏","torsolo di mela","il","organico",1],
  ["🍂","foglie secche","le","organico",1],["🍞","resti di pane","i","organico",1],["🥔","bucce di patata","le","organico",2],
  ["🍊","bucce d'arancia","le","organico",2],["🥕","avanzi di verdura","gli","organico",2],["☕","fondi di caffè","i","organico",3],
  ["🥚","gusci d'uovo","i","organico",3],["🫖","bustina di tè","la","organico",3],["💐","fiori recisi","i","organico",3],

var OGG = OGG_RAW.map(function(r){ return {e:r[0], n:r[1], a:r[2], b:r[3], tier:r[4] || 3}; });

var LIVELLI = [
  { id:"scoperta", nome:"Livello 1 · Scoperta BES", icona:"🌼", desc:"6 domande semplicissime · 2 scelte · con aiuto", totale:6, scelte:2, maxTier:1, aiutoSempre:true, primario:true },

];

function getLivello(id){
  return LIVELLI.find(function(l){ return l.id === id; }) || LIVELLI[0];
}
function nextLivello(id){
  for(var i = 0; i < LIVELLI.length - 1; i++){
    if(LIVELLI[i].id === id) return LIVELLI[i + 1];
  }
  return null;
}

function contenitore(id){ return CONT.find(function(c){ return c.id === id; }); }

function complimento(nome, sesso){
  var f = sesso === "ALUNNA";
  var bravo = f ? "brava" : "bravo";
  var bravissimo = f ? "bravissima" : "bravissimo";
  var frasi = [
    "Complimenti " + nome + ", " + bravissimo + "!",
    "Esatto, " + nome + "!",
    "Hai capito, " + nome + ", " + bravo + "!"
  ];
  return frasi[Math.floor(Math.random() * frasi.length)];
}

function nuovoRound(livelloId){
  var cfg = getLivello(livelloId);
  var totale = cfg.totale;
  var numAltri = Math.max(1, cfg.scelte - 1);
  var ordine = mescola(CONT.map(function(c){ return c.id; }));
  var usati = {};
  var dom = [];
  for(var i = 0; i < totale; i++){
    var bid = ordine[i % 5];
    var pool = OGG.filter(function(o){
      return o.b === bid && o.tier <= cfg.maxTier;
    });
    if(cfg.id === "esperto"){
      var avanzati = pool.filter(function(o){ return o.tier >= 2; });
      if(avanzati.length && i % 2 === 1) pool = avanzati;
    }
    var liberi = pool.filter(function(o){ return !usati[o.n]; });
    if(liberi.length) pool = liberi;
    var o = pool[Math.floor(Math.random() * pool.length)];
    usati[o.n] = true;
    var altri = mescola(CONT.map(function(c){ return c.id; }).filter(function(x){ return x !== bid; })).slice(0, numAltri);
    dom.push({o: o, opts: mescola([bid].concat(altri))});
  }
  return dom;
}

function getNativeFsEl(){
  return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
}

function useFullscreenSync(){
  var isEmbedded = typeof window !== "undefined" && window.parent && window.parent !== window;
  var fsState = React.useState(false);
  var isFs = fsState[0], setIsFs = fsState[1];

  React.useEffect(function(){
    function onFsChange(){
      if (!isEmbedded) setIsFs(!!getNativeFsEl());
    }
    function onMessage(ev){
      if (ev && ev.data && ev.data.type === "serr-g10-fs-state") {
        setIsFs(!!ev.data.active);
      }
    }
    document.addEventListener("fullscreenchange", onFsChange);
    document.addEventListener("webkitfullscreenchange", onFsChange);
    window.addEventListener("message", onMessage);
    if (isEmbedded) {
      try { window.parent.postMessage({ type: "serr-g10-query-fs" }, "*"); } catch(e){}
    }
    return function(){
      document.removeEventListener("fullscreenchange", onFsChange);
      document.removeEventListener("webkitfullscreenchange", onFsChange);
      window.removeEventListener("message", onMessage);
    };
  }, []);

  function toggle(){
    if (isEmbedded) {
      try { window.parent.postMessage({ type: "serr-g10-toggle-fs" }, "*"); } catch(e){}
      return;
    }
    var rootEl = document.documentElement;
    if (!getNativeFsEl()) {
      try {
        var req = rootEl.requestFullscreen || rootEl.webkitRequestFullscreen || rootEl.msRequestFullscreen;
        if (req) Promise.resolve(req.call(rootEl)).catch(function(){});
      } catch(e){}
    } else {
      try {
        var ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
        if (ex) Promise.resolve(ex.call(document)).catch(function(){});
      } catch(e){}
    }
  }

  return { isFs: isFs, toggle: toggle };
}

function SchermoInteroBtn(p){

}

function Barra(p){
  return h("nav", {className:"barra"},
    p.indietro ? h("button", {className:"btn piccolo", onClick:p.indietro}, "← Indietro") : h("span"),
    SUONO ? h("button", {className:"btn piccolo", onClick:function(){ parla(ULTIMO); }}, "🔁 RIPETI") : null,
    p.fs ? h(SchermoInteroBtn, {isFs:p.fs.isFs, toggle:p.fs.toggle, piccolo:true}) : null,
    h("button", {className:"btn piccolo", onClick:p.home}, "🏠 HOME")
  );
}

function AscoltaBtn(p){
  if(!SUONO) return null;
  return h("button", {className:"btn", onClick:function(){ parla(p.testo); }}, "🔊 " + p.etichetta);
}

function Gioco(p){
  var nome = p.nome, sesso = p.sesso;
  var cfg = getLivello(p.livello);
  var domState = React.useState(function(){ return nuovoRound(p.livello); });
  var dom = domState[0];
  var totale = dom.length;
  var iState = React.useState(0), i = iState[0], setI = iState[1];
  var errState = React.useState(0), err = errState[0], setErr = errState[1];
  var sbState = React.useState([]), sbagliate = sbState[0], setSbagliate = sbState[1];
  var esState = React.useState(null), esito = esState[0], setEsito = esState[1];
  var corState = React.useState(0), corrette = corState[0], setCorrette = corState[1];
  var msgState = React.useState(null), msg = msgState[0], setMsg = msgState[1];
  var fineState = React.useState(false), fine = fineState[0], setFine = fineState[1];
  var q = dom[i];
  var verbo = q && (q.o.a === "i" || q.o.a === "gli" || q.o.a === "le") ? "Dove vanno " : "Dove va ";
  var testo = q ? verbo + (q.o.a.endsWith("'") ? q.o.a + q.o.n : q.o.a + " " + q.o.n) + "?" : "";

  React.useEffect(function(){
    if(!q || fine) return;
    var t = setTimeout(function(){ parla(testo); }, 700);
    return function(){ clearTimeout(t); };
  }, [i, fine]);

  function termina(finaleCorrette){
    setFine(true);
    if(p.onFine) p.onFine(cfg.id, finaleCorrette, totale);
    parla("Hai completato " + cfg.nome + "! Hai dato " + finaleCorrette + " risposte giuste su " + totale + ".");
  }

  function avanti(){
    if(i + 1 >= dom.length){ termina(corrette); return; }
    setI(i + 1); setErr(0); setSbagliate([]); setEsito(null); setMsg(null);
  }

  React.useEffect(function(){
    if(esito === "ok"){
      var t = setTimeout(avanti, 3000);
      return function(){ clearTimeout(t); };
    }
  }, [esito, i]);

  function scegli(id){
    if(esito || !q) return;
    if(id === q.o.b){
      var m = complimento(nome, sesso);
      setEsito("ok"); setCorrette(function(c){ return c + 1; }); setMsg({t:m, tipo:"ok"}); parla(m);
      return;
    }
    var e = err + 1;
    setErr(e); setSbagliate(sbagliate.concat([id]));
    var c = contenitore(q.o.b);
    var maxErr = cfg.scelte >= 5 ? 3 : 2;
    if(e >= maxErr){
      setEsito("fine");
      var t1 = "La risposta giusta è il contenitore " + c.nome + ". " + c.hint;
      setMsg({t:t1, tipo:"err"}); parla(t1);
    } else {
      var t2 = "Quasi! Riprova. " + c.hint;
      setMsg({t:t2, tipo:"err"}); parla(t2);
    }
  }

  if(fine){
    var succ = nextLivello(cfg.id);
    return h("div", {className:"pagina"},
      h(Barra, {home:p.home, indietro:null, fs:p.fs}),
      h("div", {className:"grande"}, "🏆"),
      h("h1", null, "Complimenti! " + cfg.nome + " completato!"),
      h("p", {className:"testo", style:{textAlign:"center"}}, "Risposte giuste: " + corrette + " su " + totale + "."),
      h("button", {className:"btn primario", onClick:p.ricomincia}, "🔁 RIGIOCA QUESTO LIVELLO"),
      succ ? h("button", {className:"btn", onClick:function(){ p.cambiaLivello(succ.id); }}, succ.icona + " PASSA A " + succ.nome.toUpperCase()) : null,
      LIVELLI.filter(function(l){ return l.id !== cfg.id && (!succ || l.id !== succ.id); }).map(function(l){
        return h("button", {key:l.id, className:"btn piccolo", onClick:function(){ p.cambiaLivello(l.id); }}, l.icona + " " + l.nome);
      }),
      h("button", {className:"btn", onClick:p.altri}, "📦 I CONTENITORI"),
      h("button", {className:"btn", onClick:p.home}, "🏠 MENU INIZIALE")
    );
  }

  if(!q) return null;

  var aiutoVisibile = cfg.aiutoSempre ? contenitore(q.o.b).hint : null;

  return h("div", {className:"pagina"},
    h(Barra, {home:p.home, indietro:p.indietro, fs:p.fs}),
    h("p", {className:"nota"}, cfg.icona + " " + cfg.nome + " · Domanda " + (i + 1) + " di " + totale + " · Giuste: " + corrette),
    h("h2", null, testo),
    h("div", {className:"grande"}, q.o.e),
    aiutoVisibile ? h("div", {className:"blocco", style:{textAlign:"center"}}, "💡 Aiuto: ", aiutoVisibile) : null,
    h(AscoltaBtn, {testo:testo, etichetta:"ASCOLTA LA DOMANDA"}),
    h("div", {className:"riga" + (cfg.scelte >= 5 ? " riga-5" : "")},
      q.opts.map(function(id){
        var c = contenitore(id);
        var cls = "btn risposta " + c.cls;
        if(esito && id === q.o.b) cls += " giusta";
        if(sbagliate.indexOf(id) >= 0 && id !== q.o.b) cls += " sbagliata";
        var segno = (esito && id === q.o.b) ? "✓" : (sbagliate.indexOf(id) >= 0 && id !== q.o.b ? "✗" : null);
        return h("button", {key:id, className:cls, onClick:function(){ scegli(id); }, disabled: !!esito && id !== q.o.b},
          h("span", {className:"icona"}, c.emoji),
          h("span", null, "Contenitore " + c.nome),
          segno ? h("span", {className:"segno"}, segno) : null
        );
      })
    ),
    msg ? h("div", {className:"msg " + (msg.tipo === "ok" ? "ok" : "err")}, msg.t) : null,
    esito ? h("button", {className:"btn primario", onClick:avanti}, "AVANTI →") : null
  );
}

function App(){
  var nomeSalvato = React.useState(function(){ return leggi("nome", ""); })[0];
  var sessoSalvato = React.useState(function(){ return leggi("sesso", ""); })[0];
  var schState = React.useState(nomeSalvato && sessoSalvato ? "home" : "benvenuto");
  var schermo = schState[0], setSchermo = schState[1];
  var nomeState = React.useState(nomeSalvato), nome = nomeState[0], setNome = nomeState[1];
  var sexState = React.useState(sessoSalvato), sesso = sexState[0], setSesso = sexState[1];
  var bozState = React.useState(nomeSalvato), bozza = bozState[0], setBozza = bozState[1];
  var vistiState = React.useState(function(){ return leggi("visti", []); }), visti = vistiState[0], setVisti = vistiState[1];
  var bestState = React.useState(function(){ return leggi("best_livelli", {}); }), bestLivelli = bestState[0], setBestLivelli = bestState[1];
  var contState = React.useState(0), cont = contState[0], setCont = contState[1];
  var chiaveState = React.useState(0), chiave = chiaveState[0], setChiave = chiaveState[1];
  var livState = React.useState("scoperta"), livello = livState[0], setLivello = livState[1];
  var fs = useFullscreenSync();

  var home = function(){ setSchermo("home"); };
  var indietroMappa = {lista:"home", scheda:"lista", gioco:"home", fine:"home"};
  var indietro = function(){ setSchermo(indietroMappa[schermo] || "home"); };

  function avviaGioco(liv){
    setLivello(liv);
    setChiave(chiave + 1);
    setSchermo("gioco");
  }

  function registraFine(livId, score, total){
    setBestLivelli(function(prev){
      var cur = prev && prev[livId];
      var nextBest = cur && cur.score >= score ? cur : { score: score, total: total };
      var upd = Object.assign({}, prev || {});
      upd[livId] = nextBest;
      salva("best_livelli", upd);
      return upd;
    });
  }

  function inizia(){
    var n = bozza.trim();
    if(!n || !sesso) return;
    setNome(n); salva("nome", n); salva("sesso", sesso);
    setSchermo("home");
  }

  if(schermo === "benvenuto"){
    var pronto = !!bozza.trim() && !!sesso;
    return h("div", {className:"pagina"},
      h("div", {className:"riga", style:{justifyContent:"flex-end"}},
        h(SchermoInteroBtn, {isFs:fs.isFs, toggle:fs.toggle, piccolo:true})
      ),
      h("h1", null, "Benvenuto!"),
      h("label", {htmlFor:"nomeIn", className:"testo"}, "Come ti chiami?"),
      h("input", {id:"nomeIn", className:"campo", value:bozza, maxLength:20, autoComplete:"off",
        onChange:function(e){ setBozza(e.target.value); }}),
      h("p", {className:"testo"}, "Sei un alunno o un'alunna?"),
      h("div", {className:"riga"},
        h("button", {className:"btn" + (sesso === "ALUNNO" ? " sel" : ""), onClick:function(){ setSesso("ALUNNO"); }},
          h("span", {className:"icona"}, "👦"), h("span", null, "ALUNNO")),
        h("button", {className:"btn" + (sesso === "ALUNNA" ? " sel" : ""), onClick:function(){ setSesso("ALUNNA"); }},
          h("span", {className:"icona"}, "👧"), h("span", null, "ALUNNA"))
      ),
      h("button", {className:"btn primario", disabled:!pronto, onClick:inizia}, "INIZIA"),
      !SUONO ? h("p", {className:"nota"}, "La lettura vocale non è disponibile su questo dispositivo: leggi il testo scritto.") : null
    );
  }

  var percentuale = Math.round((visti.length / CONT.length) * 100);

  if(schermo === "home"){
    return h("div", {className:"pagina"},
      h("h1", null, "Raccolta differenziata ♻️"),
      h("div", {className:"riga", style:{justifyContent:"space-between", alignItems:"center"}},
        h("p", {className:"testo"}, "Ciao " + nome + "!"),
        h("button", {className:"btn piccolo", onClick:function(){ setSchermo("benvenuto"); }}, "CAMBIA ALUNNO"),
        h(SchermoInteroBtn, {isFs:fs.isFs, toggle:fs.toggle, piccolo:true})
      ),
      h("div", {className:"grande"}, "🌍"),
      h("div", {className:"progresso", role:"progressbar", "aria-valuenow":visti.length, "aria-valuemax":CONT.length},
        h("div", {style:{width: percentuale + "%"}})),
      h("p", {className:"nota"}, visti.length + " / " + CONT.length + " contenitori visti"),
      h("button", {className:"btn", onClick:function(){ setSchermo("lista"); }}, "📦 I CONTENITORI"),
      h("h2", null, "Scegli il livello di gioco"),
      LIVELLI.map(function(l){
        var rec = bestLivelli && bestLivelli[l.id];
        return h("button", {
          key: l.id,
          className: "btn liv-card" + (l.primario ? " primario" : ""),
          onClick: function(){ avviaGioco(l.id); }
        },
          h("span", null, l.icona + " " + l.nome.toUpperCase()),
          h("span", {className:"liv-sub"}, l.desc + (rec ? " · ⭐ Record: " + rec.score + "/" + rec.total : ""))
        );
      }),
      SUONO ? h("button", {className:"btn", onClick:function(){ parla("Scegli uno dei quattro livelli e tocca il contenitore giusto per ogni oggetto. Ti aiuto io!"); }}, "🔊 ASCOLTA LE ISTRUZIONI") : null
    );
  }

  if(schermo === "lista"){
    return h("div", {className:"pagina"},
      h(Barra, {home:home, indietro:indietro, fs:fs}),
      h("h2", null, "I contenitori"),
      CONT.map(function(c, idx){
        return h("button", {key:c.id, className:"btn " + c.cls, onClick:function(){
          setCont(idx);
          setVisti(function(v){ var nv = v.indexOf(c.id) >= 0 ? v : v.concat([c.id]); salva("visti", nv); return nv; });
          setSchermo("scheda");
        }},
          h("span", {className:"icona"}, c.emoji),
          h("span", null, "Contenitore " + c.nome));
      })
    );
  }

  if(schermo === "scheda"){
    var c = CONT[cont];
    var testo = "Contenitore " + c.nome + ", colore " + c.colore + ". Ci vanno: " + c.ci + " Non ci vanno: " + c.no;
    return h("div", {className:"pagina"},
      h(Barra, {home:home, indietro:indietro, fs:fs}),
      h("div", {className:"grande"}, c.emoji),
      h("h2", null, "Contenitore " + c.nome),
      h("div", {className:"blocco " + c.cls},
        h("strong", null, "Colore: "), c.colore),
      h("div", {className:"blocco"},
        h("strong", null, "Ci vanno: "), c.ci),
      h("div", {className:"blocco"},
        h("strong", null, "Non ci vanno: "), c.no),
      h(AscoltaBtn, {testo:testo, etichetta:"ASCOLTA LA SCHEDA"}),
      h("button", {className:"btn primario", onClick:function(){ avviaGioco("scoperta"); }}, "🌼 GIOCHIAMO · LIVELLO 1 (BES)"),
      h("button", {className:"btn", onClick:function(){ avviaGioco("facile"); }}, "🌱 GIOCHIAMO · LIVELLO 2 (FACILE)"),
      h("button", {className:"btn", onClick:function(){ avviaGioco("normale"); }}, "🎮 GIOCHIAMO · LIVELLO 3 (NORMALE)"),
      h("button", {className:"btn", onClick:function(){ avviaGioco("esperto"); }}, "🏆 GIOCHIAMO · LIVELLO 4 (ESPERTO)")
    );
  }

  if(schermo === "gioco"){
    return h(Gioco, {
      key: chiave + "_" + livello,
      livello: livello,
      nome: nome,
      sesso: sesso,
      home: home,
      indietro: indietro,
      fs: fs,
      onFine: registraFine,
      ricomincia: function(){ setChiave(chiave + 1); },
      cambiaLivello: function(nextId){ avviaGioco(nextId || "scoperta"); },
      altri: function(){ setSchermo("lista"); }
    });
  }

  return null;
}

var rootEl = document.getElementById("root");
try {
  if (typeof ReactDOM.createRoot === "function") {
    ReactDOM.createRoot(rootEl).render(h(App));
  } else {
    ReactDOM.render(h(App), rootEl);
  }
} catch (err) {
  window.__RACC_ERR(
    "Errore di avvio Raccolta Differenziata",
    "Impossibile avviare l'interfaccia interattiva su questo browser (" + String(err && err.message ? err.message : err) + ")."
  );
}
})();
</script>
</body>
</html>
